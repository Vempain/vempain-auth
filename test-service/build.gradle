plugins {
	id 'java'
	alias(libs.plugins.freefair.lombok)
	alias(libs.plugins.spring.dependency.management)
}

group = 'fi.poltsi.vempain'
version = project.hasProperty("releaseVersion") ? project.releaseVersion : libs.versions.project.get()

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(libs.versions.java.get().toInteger())
	}
}

repositories {
	mavenCentral()
}

// Report deprecated API use and unchecked operations with their location instead of javac's "recompile with -Xlint" note, and fail the
// build on any of them (-Werror): deprecated 3rd-party functionality is replaced, never carried along; deliberate exceptions need an
// explicit @SuppressWarnings with a comment
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked', '-Werror']
}

dependencies {
	implementation project(':core')
	implementation libs.spring.boot.starter.data.jpa
	implementation libs.spring.boot.starter.test
	implementation libs.spring.boot.starter.security.test
	implementation libs.spring.boot.starter.webmvc.test
	testImplementation libs.junit.jupiter
	testRuntimeOnly libs.junit.platform.launcher
}

tasks.named('test') {
	useJUnitPlatform()
	dependsOn(':api:test', ':core:test')
}
